[project]
name = "wispr-client"
version = "0.1.0"
description = "Unofficial, typed Python client and CLI for Wispr Flow speech-to-text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66,<2",
    "protobuf>=7.35.1,<8", # must be >= the version that generated _proto/flow_api_v1_pb2.py
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.scripts]
wispr = "wispr_client.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "grpcio-tools>=1.66,<2",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-protobuf",
    "grpc-stubs",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Wispr service with your stored login (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/wispr_client/_proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PL", "PT", "TC", "RET", "PTH", "N", "S"]
ignore = ["PLR0913", "PLR2004", "S603", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "TC"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["src/wispr_client/_proto/.*_pb2\\.py$"]

[[tool.mypy.overrides]]
module = ["wispr_client._proto.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
